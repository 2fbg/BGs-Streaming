<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK21 Streaming</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: #ffffff;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: system-ui, sans-serif;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(229, 9, 20, 0.2);
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        window.location.replace("https://bgstreaming.vercel.app/");
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p style="font-size: 18px; font-weight: bold; letter-spacing: 1px;">Iniciando MK21 Streaming...</p>
    </div>
</body>
</html>
