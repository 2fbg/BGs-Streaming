name: List GitHub App Repositories

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1-5'

jobs:
  list-repositories:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyJWT cryptography requests

      - name: Run Python script
        env:
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_ID: '3988402'
          GH_INSTALLATION_ID: '138628024'
        run: python scripts/app_report.py

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-app-access-report
          path: |
            repositories.json
            github-app-access-report.json
            github-app-access-report.md
