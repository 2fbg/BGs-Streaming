name: List GitHub App Repositories

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1-5'

jobs:
  list-repositories:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Generate high-privilege token for Perplexy App
        id: get_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: '3988402'
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.get_token.outputs.token }}

      - name: Write Python script
        run: |
          cat > app_report.py <<'PYTHON'
          import os
          import json
          import urllib.request
          from datetime import datetime, timezone

          installation_token = os.environ['GH_TOKEN']
          app_id = os.environ['GH_APP_ID']
          installation_id = os.environ['GH_INSTALLATION_ID']

          repo_headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {installation_token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'github-actions-github-app-report',
          }

          repos = []
          page = 1

          while True:
              url = f'https://api.github.com/installation/repositories?per_page=100&page={page}'
              req = urllib.request.Request(url, headers=repo_headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.loads(response.read().decode('utf-8'))
              except Exception as e:
                  print(f"Error calling {url}: {e}")
                  raise e

              batch = data.get('repositories', [])
              repos.extend(batch)

              if len(batch) < 100:
                  break

              page += 1

          with open('repositories.json', 'w', encoding='utf-8') as f:
              json.dump({'total_count': len(repos), 'repositories': repos}, f, indent=2, ensure_ascii=False)

          summary = {
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'app_id': app_id,
              'installation_id': installation_id,
              'token_expires_at': 'Managed by GitHub Action',
              'total_repositories': len(repos),
              'private_repositories': sum(1 for r in repos if r.get('private')),
              'public_repositories': sum(1 for r in repos if not r.get('private')),
              'token_permissions': 'Managed by GitHub Action',
          }

          report = {
              'summary': summary,
              'repositories': [
                  {
                      'id': r.get('id'),
                      'name': r.get('name'),
                      'full_name': r.get('full_name'),
                      'private': r.get('private'),
                      'visibility': r.get('visibility'),
                      'default_branch': r.get('default_branch'),
                      'html_url': r.get('html_url'),
                      'owner': (r.get('owner') or {}).get('login'),
                      'archived': r.get('archived'),
                      'disabled': r.get('disabled'),
                      'fork': r.get('fork'),
                      'updated_at': r.get('updated_at'),
                      'pushed_at': r.get('pushed_at'),
                      'permissions': r.get('permissions', {}),
                  }
                  for r in repos
              ],
          }

          with open('github-app-access-report.json', 'w', encoding='utf-8') as f:
              json.dump(report, f, indent=2, ensure_ascii=False)

          lines = []
          lines.append('# Relatório de acesso da GitHub App')
          lines.append('')
          lines.append('## Resumo')
          lines.append('')
          lines.append(f"- Gerado em UTC: {summary['generated_at_utc']}")
          lines.append(f"- App ID: {summary['app_id']}")
          lines.append(f"- Installation ID: {summary['installation_id']}")
          lines.append(f"- Total de repositórios: {summary['total_repositories']}")
          lines.append(f"- Repositórios privados: {summary['private_repositories']}")
          lines.append(f"- Repositórios públicos: {summary['public_repositories']}")
          lines.append('')
          lines.append('## Repositórios')
          lines.append('')

          for i, r in enumerate(report['repositories'], 1):
              lines.append(f"### {i}. {r['full_name']}")
              lines.append(f"- URL: {r['html_url']}")
              lines.append(f"- Owner: {r['owner']}")
              lines.append(f"- Visibility: {r['visibility']}")
              lines.append(f"- Private: {r['private']}")
              lines.append(f"- Default branch: {r['default_branch']}")
              lines.append(f"- Archived: {r['archived']}")
              lines.append(f"- Disabled: {r['disabled']}")
              lines.append(f"- Fork: {r['fork']}")
              lines.append(f"- Updated at: {r['updated_at']}")
              lines.append(f"- Pushed at: {r['pushed_at']}")
              lines.append(f"- Permissions: `{json.dumps(r['permissions'], ensure_ascii=False)}`")
              lines.append('')

          with open('github-app-access-report.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines))
          PYTHON

      - name: Run Python script
        env:
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
          GH_APP_ID: '3988402'
          GH_INSTALLATION_ID: '138628024'
        run: python app_report.py

      - name: Commit and Push Reports to Repository
        run: |
          mkdir -p reports
          mv repositories.json reports/
          mv github-app-access-report.json reports/
          mv github-app-access-report.md reports/

          # Configure Git credentials as Perplexy Bot
          git config --global user.name "perplexy[bot]"
          git config --global user.email "3988402+perplexy[bot]@users.noreply.github.com"

          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m "docs: automated update of repository access reports by Perplexy App [skip ci]"
            git push
          else
            echo "No changes in repositories list."
          fi

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-app-access-report
          path: |
            reports/repositories.json
            reports/github-app-access-report.json
            reports/github-app-access-report.md
