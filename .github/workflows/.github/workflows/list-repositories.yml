name: List Repositories

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "GitHub user or organization to inspect"
        required: false
        default: "2fbg"
      type:
        description: "owner type: owner, user, or org"
        required: false
        default: "owner"

permissions:
  contents: read

jobs:
  list-repositories:
    name: List repositories via GitHub API
    runs-on: ubuntu-latest

    steps:
      - name: Validate tools
        run: |
          gh --version
          jq --version

      - name: Resolve API target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${{ github.event.inputs.owner || '2fbg' }}"
          TYPE="${{ github.event.inputs.type || 'owner' }}"

          case "$TYPE" in
            owner)
              API_URL="https://api.github.com/users/${OWNER}/repos?per_page=100&page=1"
              ;;
            user)
              API_URL="https://api.github.com/users/${OWNER}/repos?per_page=100&page=1"
              ;;
            org)
              API_URL="https://api.github.com/orgs/${OWNER}/repos?per_page=100&page=1"
              ;;
            *)
              echo "Invalid type: $TYPE"
              exit 1
              ;;
          esac

          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Fetch repositories
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          API_URL="${{ steps.target.outputs.api_url }}"
          PAGE=1

          rm -f repos.json
          echo '[]' > repos.json

          while true; do
            PAGE_URL="$(echo "$API_URL" | sed -E "s/page=[0-9]+/page=${PAGE}/")"
            echo "Fetching: $PAGE_URL"

            RESPONSE="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$PAGE_URL")"

            COUNT="$(echo "$RESPONSE" | jq 'length')"

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            jq -s 'add' repos.json <(echo "$RESPONSE") > repos.tmp.json
            mv repos.tmp.json repos.json

            if [ "$COUNT" -lt 100 ]; then
              break
            fi

            PAGE=$((PAGE + 1))
          done

          jq 'sort_by(.full_name)' repos.json > repos.sorted.json
          mv repos.sorted.json repos.json

          TOTAL="$(jq 'length' repos.json)"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

          {
            echo "repository_names<<EOF"
            jq -r '.[].full_name' repos.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Show repositories
        shell: bash
        run: |
          set -euo pipefail

          echo "Owner: ${{ steps.target.outputs.owner }}"
          echo "Type: ${{ steps.target.outputs.type }}"
          echo "Total repositories: ${{ steps.fetch.outputs.total }}"
          echo
          echo "Repositories:"
          jq -r '.[] | "- (.full_name) | private=(.private) | archived=(.archived) | default_branch=(.default_branch)"' repos.json

      - name: Upload repository list artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository-list
          path: repos.json
