<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGs Streaming - Advanced Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
    <script src="js/proxy-manager.js" defer></script>
    <script src="js/advanced-player.js" defer></script>
    <style>
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans">
    <div id="app-loader" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center hidden">
        <div class="w-12 h-12 border-4 border-red-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p id="loader-message" class="text-slate-400">Carregando...</p>
        <p id="loader-progress" class="text-xs text-slate-600 mt-2">0%</p>
    </div>

    <div class="min-h-screen flex flex-col">
        <header class="h-16 border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40 flex items-center px-6 justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center"><i class="fas fa-play text-white text-xs"></i></div>
                <h1 class="font-bold text-lg tracking-tight">BGs <span class="text-red-500">Streaming</span></h1>
            </div>
            <button id="logout-button" class="hidden text-sm text-slate-400 hover:text-white transition-colors"><i class="fas fa-sign-out-alt mr-2"></i>Sair</button>
        </header>

        <main id="login-screen" class="flex-1 flex items-center justify-center p-4">
            <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                <h2 class="text-xl font-bold text-white mb-6 text-center">Acesse sua Lista</h2>
                <div class="space-y-4">
                    <select id="server-selector" class="w-full h-11 bg-slate-950 border border-slate-800 rounded-xl px-4 text-sm outline-none focus:border-red-500"></select>
                    <div class="grid grid-cols-2 gap-3">
                        <input id="user-input" type="text" placeholder="Usuário" class="w-full h-11 bg-slate-950 border border-slate-800 rounded-xl px-4 text-sm outline-none focus:border-red-500">
                        <input id="pass-input" type="password" placeholder="Senha" class="w-full h-11 bg-slate-950 border border-slate-800 rounded-xl px-4 text-sm outline-none focus:border-red-500">
                    </div>
                    <select id="cors-selector" class="w-full h-11 bg-slate-950 border border-slate-800 rounded-xl px-4 text-sm outline-none focus:border-red-500">
                        <option value="auto">⚡ Automático</option>
                        <option value="vercel">🛡️ Vercel Proxy</option>
                        <option value="direct">📶 Direto</option>
                    </select>
                    <button id="login-button" class="w-full h-12 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition-all active:scale-95">Conectar</button>
                </div>
            </div>
        </main>

        <main id="player-screen" class="flex-1 hidden flex-col lg:flex-row overflow-hidden">
            <aside class="w-full lg:w-64 border-r border-slate-800 bg-slate-900/20 flex flex-col">
                <div class="p-4 flex gap-2">
                    <button data-type="LIVE" class="type-btn flex-1 py-2 rounded-lg text-[10px] font-bold bg-red-600 text-white">LIVE</button>
                    <button data-type="MOVIE" class="type-btn flex-1 py-2 rounded-lg text-[10px] font-bold text-slate-400 hover:bg-slate-800">FILMES</button>
                    <button data-type="SERIES" class="type-btn flex-1 py-2 rounded-lg text-[10px] font-bold text-slate-400 hover:bg-slate-800">SÉRIES</button>
                </div>
                <div id="category-list" class="flex-1 overflow-y-auto px-2 pb-4 space-y-1 scrollbar-thin"></div>
            </aside>

            <section class="flex-1 flex flex-col min-w-0">
                <div class="h-14 border-b border-slate-800 px-4 flex items-center gap-3">
                    <div class="flex-1 relative">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-600 text-xs"></i>
                        <input id="search-input" type="text" placeholder="Buscar..." class="w-full h-9 bg-slate-900/50 border border-slate-800 rounded-lg pl-9 pr-3 text-xs outline-none focus:border-red-500">
                    </div>
                </div>
                <div id="media-grid" class="flex-1 overflow-y-auto p-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-4 scrollbar-thin"></div>
            </section>

            <aside id="player-column" class="w-full lg:w-80 border-l border-slate-800 bg-slate-900/50 flex flex-col">
                <div class="aspect-video bg-black relative">
                    <video id="iptv-video" class="w-full h-full" controls playsinline></video>
                    <div id="player-banner" class="absolute inset-0 flex items-center justify-center bg-slate-900">
                        <i class="fas fa-play text-slate-800 text-3xl"></i>
                    </div>
                </div>
                <div class="p-4 flex-1 overflow-y-auto scrollbar-thin">
                    <div id="detail-pane" class="hidden space-y-4">
                        <h2 id="detail-name" class="font-bold text-white text-lg"></h2>
                        <p id="detail-category" class="text-xs text-slate-500"></p>
                        <div class="flex gap-2">
                            <a id="vlc-launcher" href="#" class="flex-1 py-2 bg-orange-600/10 text-orange-500 text-[10px] font-bold rounded-lg text-center border border-orange-600/20">VLC</a>
                            <a id="external-launcher" href="#" class="flex-1 py-2 bg-slate-800 text-slate-300 text-[10px] font-bold rounded-lg text-center">OUTRO</a>
                        </div>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script>
        const PREDEFINED_SERVERS = [{ name: "Servidor Principal", baseUrl: "http://example.com" }];
        let playlistItems = [], activeType = 'LIVE', activeCategory = 'ALL', advancedPlayer = null;

        window.addEventListener('DOMContentLoaded', () => {
            const srvSel = document.getElementById('server-selector');
            PREDEFINED_SERVERS.forEach(s => {
                const o = document.createElement('option'); o.value = s.baseUrl; o.textContent = s.name; srvSel.appendChild(o);
            });
            
            advancedPlayer = new AdvancedPlayer(document.getElementById('iptv-video'));
            setupListeners();
        });

        function setupListeners() {
            document.getElementById('login-button').onclick = performLogin;
            document.getElementById('logout-button').onclick = () => location.reload();
            document.querySelectorAll('.type-btn').forEach(b => b.onclick = (e) => {
                document.querySelectorAll('.type-btn').forEach(x => x.classList.remove('bg-red-600', 'text-white'));
                e.target.classList.add('bg-red-600', 'text-white');
                activeType = e.target.dataset.type;
                activeCategory = 'ALL';
                renderCategories(); renderMediaItems();
            });
            document.getElementById('search-input').oninput = renderMediaItems;
        }

        async function performLogin() {
            const user = document.getElementById('user-input').value, pass = document.getElementById('pass-input').value;
            const baseUrl = document.getElementById('server-selector').value;
            if (!user || !pass) return alert('Preencha tudo!');

            const loader = document.getElementById('app-loader'); loader.classList.remove('hidden');
            const url = `${baseUrl}/get.php?username=${user}&password=${pass}&type=m3u_plus&output=mpegts`;
            const proxiedUrl = proxyManager.getProxyUrl(url);

            try {
                const res = await fetch(proxiedUrl);
                const text = await res.text();
                playlistItems = parseM3U(text);
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('player-screen').classList.remove('hidden');
                document.getElementById('logout-button').classList.remove('hidden');
                renderCategories(); renderMediaItems();
            } catch (e) { alert('Erro ao conectar'); }
            finally { loader.classList.add('hidden'); }
        }

        function parseM3U(data) {
            const items = [], lines = data.split('\n');
            let cur = null;
            for (let l of lines) {
                l = l.trim();
                if (l.startsWith('#EXTINF:')) {
                    cur = { name: l.split(',')[1], logo: l.match(/tvg-logo="(.*?)"/)?.[1], category: l.match(/group-title="(.*?)"/)?.[1] };
                    cur.type = l.includes('movie') ? 'MOVIE' : (l.includes('series') ? 'SERIES' : 'LIVE');
                } else if (l.startsWith('http') && cur) {
                    cur.url = l; items.push(cur); cur = null;
                }
            }
            return items;
        }

        function renderCategories() {
            const filtered = playlistItems.filter(i => i.type === activeType);
            const cats = ['ALL', ...new Set(filtered.map(i => i.category).filter(Boolean))];
            const list = document.getElementById('category-list'); list.innerHTML = '';
            cats.forEach(c => {
                const b = document.createElement('button');
                b.className = `w-full text-left px-3 py-2 rounded-lg text-[10px] font-medium ${activeCategory === c ? 'bg-slate-800 text-white' : 'text-slate-500 hover:text-slate-300'}`;
                b.textContent = c === 'ALL' ? 'TODAS' : c;
                b.onclick = () => { activeCategory = c; renderCategories(); renderMediaItems(); };
                list.appendChild(b);
            });
        }

        function renderMediaItems() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const filtered = playlistItems.filter(i => i.type === activeType && (activeCategory === 'ALL' || i.category === activeCategory) && i.name.toLowerCase().includes(q));
            const grid = document.getElementById('media-grid'); grid.innerHTML = '';
            filtered.slice(0, 50).forEach(item => {
                const d = document.createElement('div');
                d.className = 'bg-slate-900 rounded-lg overflow-hidden cursor-pointer border border-slate-800 hover:border-red-500 transition-all';
                d.innerHTML = `<div class="aspect-[2/3] flex items-center justify-center p-2">${item.logo ? `<img src="${item.logo}" class="w-full h-full object-contain">` : `<i class="fas fa-play text-slate-800 text-xl"></i>`}</div><div class="p-2"><p class="text-[10px] font-bold truncate">${item.name}</p></div>`;
                d.onclick = () => playStream(item);
                grid.appendChild(d);
            });
        }

        async function playStream(item) {
            document.getElementById('player-banner').classList.add('hidden');
            document.getElementById('detail-pane').classList.remove('hidden');
            document.getElementById('detail-name').textContent = item.name;
            document.getElementById('detail-category').textContent = item.category;
            document.getElementById('vlc-launcher').href = `vlc://${item.url}`;
            
            const proxiedUrl = proxyManager.getProxyUrl(item.url);
            await advancedPlayer.play(proxiedUrl, { isLive: item.type === 'LIVE' });
        }
    </script>
</body>
</html>
