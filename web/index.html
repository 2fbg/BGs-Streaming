<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>BG Streaming - MK21 MultiServidor</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'red-950': '#0A0A16',
                        'amber-950': '#1C1100',
                        'emerald-950': '#0A221E',
                        'blue-400': '#3B82F6',
                        'slate-950': '#0F172A',
                        'slate-800': '#1E293B',
                        'red-950': '#1E1010',
                        'amber-950': '#1C1200',
                        'blue-400': '#60A5FA',
                        'emerald-500': '#10B981',
                        'emerald-400': '#34D399',
                        'amber-400': '#FBBF24',
                        'amber-500': '#D97706',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-white">
    <div class="max-w-4xl mx-auto p-4">
        <!-- LOGIN SCREEN -->
        <div id="login-screen" class="block">
            <div class="text-center my-8">
                <h1 class="text-3xl font-bold text-red-600">BG Streaming</h1>
                <p class="text-slate-400">MultiServidor IPTV</p>
            </div>

            <div class="bg-slate-800 p-6 rounded-lg my-8">
                <label class="block text-sm mb-2">Selecione o servidor:</label>
                <select id="server-selector" class="w-full p-2 mb-4 bg-slate-900 rounded">
                    <option value="http://vlogmk21.vercel.app">VLOG MK21</option>
                    <option value="http://bgstreaming.vercel.app">Vercel Proxy</option>
                    <option value="http://cb6000.tv">CorsProxy.io</option>
                    <option value="https://corsproxy.io">CorsProxy.io</option>
                    <option value="https://api.allorigins.win">AllOrigins.win</option>
                </select>

                <label class="block mt-4 mb-2 text-sm">Usuário:</label>
                <input type="text" id="user-input" class="w-full p-2 mb-4 bg-slate-900 rounded">
                
                <label class="block mt-4 mb-2 text-sm">Senha:</label>
                <input type="password" id="pass-input" class="w-full p-2 mb-4 bg-slate-900 rounded">
                
                <label class="block mt-4 mb-2 text-sm">Método de Conexão:</label>
                <select id="proxy-selector" class="w-full p-2 mb-4 bg-slate-900 rounded">
                    <option value="direct">Conexão Direta</option>
                    <option value="vercel">Proxy Vercel</option>
                    <option value="corsproxy">CorsProxy.io</option>
                    <option value="allorigins">AllOrigins.win</option>
                </select>

                <button id="login-btn" class="w-full p-3 bg-red-600 hover:bg-red-500 rounded-lg font-bold">
                    Entrar
                </button>
            </div>
        </div>

        <!-- PLAYER SCREEN -->
        <div id="player-screen" class="hidden">
            <div class="aspect-video bg-black relative">
                <video id="video-player" class="w-full h-full"></video>
                <div class="absolute bottom-0 bg-slate-900/80 w-full p-2">
                    <button id="play-btn" class="text-white">Play/Pause</button>
                    <button id="volume-btn" class="text-white">🔊</button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05">
                    <button id="fullscreen-btn" class="text-white">⛶</button>
                </div>
            </div>

            <div id="channels-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 mt-4">
                <!-- Canais carregados aqui -->
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES GLOBAIS
        const SERVERS = [
            { name: "VLOG MK21", url: "http://vlogmk21.vercel.app" },
            { name: "BG Streaming", url: "https://bgstreaming.vercel.app" },
            { name: "CorsProxy", url: "https://corsproxy.io" }
        ];

        let currentServer = SERVERS[0];
        let currentUser = "";
        let currentPass = "";

        // ELEMENTOS DO DOM
        const loginScreen = document.getElementById("login-screen");
        const playerScreen = document.getElementById("player-screen");
        const serverSelector = document.getElementById("server-selector");
        const userInput = document.getElementById("user-input");
        const passInput = document.getElementById("pass-input");
        const proxySelector = document.getElementById("proxy-selector");
        const loginBtn = document.getElementById("login-btn");

        // INICIALIZAÇÃO
        document.addEventListener("DOMContentLoaded", () => {
            // Popula servidores
            SERVERS.forEach(server => {
                const opt = document.createElement("option");
                opt.value = server.url;
                opt.textContent = server.name;
                serverSelector.appendChild(opt);
            });

            // Login button click
            loginBtn.addEventListener("click", async () => {
                currentUser = userInput.value;
                currentPass = passInput.value;
                currentServer = SERVERS[serverSelector.selectedIndex];
                
                // Validação básica
                if (!currentUser || !currentPass) {
                    alert("Preencha usuário e senha!");
                    return;
                }

                // Mostra carregamento
                document.getElementById("loading").classList.remove("hidden");
                
                try {
                    // Tenta conectar com proxy ou diretamente
                    const proxyType = proxySelector.value;
                    let streamUrl = currentServer.url + "?username=" + encodeURIComponent(currentUser) + "&password=" + encodeURIComponent(currentPass);
                    
                    if (proxyType === "vercel") {
                        streamUrl = "https://bgstreaming.vercel.app/api/proxy?url=" + encodeURIComponent(streamUrl);
                    } else if (proxyType === "corsproxy") {
                        streamUrl = "https://corsproxy.io/?=" + encodeURIComponent(streamUrl);
                    } else if (proxyType === "allorigins") {
                        streamUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(streamUrl);
                    }

                    // Busca a lista M3U
                    const response = await fetch(streamUrl);
                    const m3uContent = await response.text();
                    
                    // PARSE DO M3U
                    const channels = parseM3U(m3uContent);
                    renderChannels(channels);
                    
                    // Mostra player
                    loginScreen.classList.add("hidden");
                    playerScreen.classList.remove("hidden");

                } catch (err) {
                    alert("Erro ao conectar: " + err.message);
                    document.getElementById("loading").classList.add("hidden");
                }
            });

            function parseM3U(content) {
                const lines = content.split("\n");
                const channels = [];
                let currentChannel = null;

                for (const line of lines) {
                    if (line.startsWith("#EXTINF:")) {
                        // Extrai dados do canal
                        const data = line.split(",")[1];
                        currentChannel = {
                            name: data,
                            group: line.match(/group-title="([^"]+)"/)[1] || "Geral"
                        };
                    } else if (line.startsWith("http")) {
                        if (currentChannel) {
                            currentChannel.url = line;
                            channels.push(currentChannel);
                            currentChannel = null;
                        }
                    }
                }
                return channels;
            }

            function renderChannels(channels) {
                const grid = document.getElementById("channels-grid");
                grid.innerHTML = "";

                channels.forEach(channel => {
                    const card = document.createElement("div");
                    card.className = "bg-slate-800 p-2 rounded-lg hover:bg-slate-700 cursor-pointer";
                    card.innerHTML = `
                        <h3 class="font-bold">${channel.name}</h3>
                        <p class="text-sm text-slate-400">${channel.group}</p>
                    `;
                    
                    card.addEventListener("click", () => playChannel(channel));
                    grid.appendChild(card);
                });
            }

            function playChannel(channel) {
                const video = document.getElementById("video-player");
                video.src = channel.url;
                
                // Se houver problema de Mixed Content (HTTPS + HTTP)
                if (window.location.protocol === "https:" && channel.url.startsWith("http:")) {
                    // Usa proxy ou avisa o usuário
                    alert("Conteúdo misto bloqueado! Use o proxy ou habilite conteúdo não seguro nas configurações do navegador.");
                    // Alternativa: abrir em HTTP
                    const httpLink = document.createElement("a");
                    httpLink.href = "http://" + window.location.hostname + window.location.pathname;
                    httpLink.textContent = "Acessar via HTTP";
                    document.body.appendChild(httpLink);
                }

                video.play().catch(err => {
                    alert("Erro ao reproduzir! Tente usar o VLC: " + channel.url);
                    // Abre no VLC
                    const vlcLink = document.createElement("a");
                    vlcLink.href = "vlc://" + channel.url;
                    vlcLink.textContent = "Abrir no VLC";
                    document.body.appendChild(vlcLink);
                });
            }
        });
    </script>
</body>
</html>
